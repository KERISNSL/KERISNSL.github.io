<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Principal Investigator | KERI SNSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Play:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="professor" data-title="Principal Investigator" data-sub="박준우 교수">
<main>
  <section class="section gray">
    <div class="wrap">
      <div class="pi reveal" id="piCard"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <header class="head left reveal"><p class="eyebrow">Achievements</p><h2>대표 성과</h2></header>
      <div class="ach-grid reveal" id="piAchievements"></div>
    </div>
  </section>

  <section class="section gray">
    <div class="wrap">
      <header class="head left reveal"><p class="eyebrow">Awards</p><h2>수상</h2></header>
      <ul class="award-list reveal" id="piAwards"></ul>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <header class="head left reveal"><p class="eyebrow">Projects</p><h2>수행 중인 연구과제</h2></header>
      <ul class="project-list reveal" id="piProjects"></ul>
    </div>
  </section>

  <section class="section gray">
    <div class="wrap two-col">
      <div>
        <header class="head left reveal"><p class="eyebrow">Broadcast</p><h2>방송</h2></header>
        <ul class="link-list reveal" id="piMedia"></ul>
      </div>
      <div>
        <header class="head left reveal"><p class="eyebrow">Press</p><h2>관련 기사</h2></header>
        <ul class="link-list reveal" id="piPress"></ul>
      </div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
