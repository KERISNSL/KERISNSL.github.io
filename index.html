<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KERI SNSL | Sulfur and Solid Lab</title>
  <meta name="description" content="한국전기연구원 SNSL 연구실 (Sulfur and Solid Lab) - 전고체전지와 리튬황전지 연구">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Play:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<main>

  <!-- 첫 화면 배너 -->
  <section class="hero" id="hero" aria-label="주요 소식">
    <canvas class="hero-fx" id="heroFx" aria-hidden="true"></canvas>   <!-- 움직이는 배경 (main.js 의 "배너 애니메이션") -->
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-ctrl">
      <button id="heroPrev" aria-label="이전">&larr;</button>
      <div class="hero-dots" id="heroDots"></div>
      <button id="heroNext" aria-label="다음">&rarr;</button>
    </div>
  </section>

  <!-- 연구 요약 -->
  <section class="section pattern" id="overview">
    <div class="wrap">
      <header class="head reveal"><p class="eyebrow">Our Research</p><h2>Research Overview</h2></header>
      <p class="intro reveal" id="aboutIntro"></p>
      <div class="research-grid" id="researchGrid"></div>
      <div class="stats reveal" id="stats"></div>
    </div>
  </section>

  <!-- 최근 소식 + 사진 -->
  <section class="section gray">
    <div class="wrap">
      <header class="head reveal"><p class="eyebrow">SNSL News</p><h2>Latest News</h2></header>
      <div class="news-wrap">
        <div class="news-list reveal" id="newsList" data-limit="3"></div>
        <div class="gallery reveal" id="gallery">
          <span class="gallery-tag">GALLERY</span>
          <div class="gallery-slides" id="gallerySlides"></div>
          <div class="gallery-dots" id="galleryDots"></div>
        </div>
      </div>
      <p class="more"><a class="btn-line" href="news.html">소식 더 보기 &rarr;</a><a class="btn-line" href="gallery.html">사진 더 보기 &rarr;</a></p>
    </div>
  </section>

  <!-- 대표 논문 (파란 띠) -->
  <section class="section blue">
    <div class="wrap">
      <header class="head light">
        <button class="round" id="hlPrev" aria-label="이전">&larr;</button>
        <div><p class="eyebrow">SNSL</p><h2>Publication</h2></div>
        <button class="round" id="hlNext" aria-label="다음">&rarr;</button>
      </header>
    </div>
    <div class="hl-track" id="hlTrack"></div>
    <p class="hl-more"><a href="publications.html">논문 · 특허 전체 보기 &rarr;</a></p>
  </section>

</main>
<script src="publications.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
